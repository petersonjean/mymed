<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Med – prototype (camera + video)</title>
<style>
/*––– DESIGN TOKENS –––––––––––––––––––––*/
:root{
  --blue:#007aff;           /* primary */
  --blue-dark:#0051c6;
  --gray-100:#f2f4f7;
  --gray-300:#d0d5dc;
  --gray-700:#3d4754;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow:0 4px 10px rgba(0,0,0,.08);
  --font-base:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
/*––– BASICS ––––––––––––––––––––––––––––*/
*{box-sizing:border-box;}
body{
  margin:0;padding:0;
  font-family:var(--font-base);
  background:var(--gray-100);
  color:var(--gray-700);
}
h1,h2,h3{margin:0 0 .5em}
button{
  font-size:1.05rem;
  font-weight:600;
  padding:1rem 1.5rem;
  border:none;
  border-radius:var(--radius-md);
  color:#fff;
  background:var(--blue);
  cursor:pointer;
  width:100%;
}
button:active{background:var(--blue-dark);} 
.hidden{display:none!important;}
.main{
  max-width:480px;
  margin:0 auto;
  padding:1rem .5rem 4rem;
}
/*––– SCREEN CONTAINERS ––––––––––––––––*/
.screen{
  background:#fff;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:1.5rem 1.25rem 2.5rem;
}
/*––– 1. SCAN ––––––––––––––––––––––––––*/
#camera-view{
  width:100%;
  aspect-ratio:3/4;
  background:#000; /* fallback */
  border-radius:var(--radius-lg);
  position:relative;
  overflow:hidden;
  margin-bottom:1rem;
}
#camera-stream{
  width:100%;height:100%;object-fit:cover;
}
#camera-frame{          /* framing guides */
  position:absolute;inset:0;
  border:6px solid #fff;
  border-radius:var(--radius-lg);
  pointer-events:none;
}
/*––– 2. MED DETAIL ––––––––––––––––––––*/
.med-photo{
  width:100%;
  border-radius:var(--radius-md);
  object-fit:cover;
}
.tab-row{
  display:flex;margin:.75rem 0 1rem;
}
.tab-row button{
  flex:1;
  padding:.75rem 0;
  background:var(--gray-100);
  color:var(--gray-700);
  border-radius:0;
  border:1px solid var(--gray-300);
  border-right:none;
}
.tab-row button:last-child{border-right:1px solid var(--gray-300);} 
.tab-row button.active{
  background:var(--blue);
  color:#fff;
}
.ai-avatar{
  width:96px;height:96px;
  border-radius:50%;
  object-fit:cover;
  margin:1rem auto;
  display:block;
}
#med-video{
  width:100%;border-radius:var(--radius-md);margin-top:1rem;
}
/*––– 3. TRACKER –––––––––––––––––––––––*/
.progress-ring{
  width:120px;height:120px;
  border-radius:50%;
  background:conic-gradient(var(--blue) calc(var(--pct)*1%), var(--gray-300) 0);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;font-size:1.25rem;color:var(--gray-700);
  margin:0 auto 1rem;
}
.checklist label{
  display:flex;align-items:center;
  gap:.75rem;
  font-size:1.1rem;
  margin:.5rem 0;
}
.checklist input{width:28px;height:28px;}
/*––– 4. TODAY’S MEDS ––––––––––––––––––*/
.med-card{
  background:var(--gray-100);
  border-radius:var(--radius-md);
  padding:.75rem 1rem;
  margin-bottom:.75rem;
  display:flex;justify-content:space-between;align-items:center;
  font-size:1.1rem;
}
</style>
</head>
<body>
<main class="main">
  <!-- 1. Scan Label (launch) -->
  <section id="screen-scan" class="screen">
    <h2>Scan&nbsp;Label</h2>
    <div id="camera-view" aria-label="live camera view">
      <video id="camera-stream" autoplay playsinline muted></video>
      <div id="camera-frame"></div>
    </div>
    <p>Align the QR or RFID label on your medication within the frame</p>
    <button id="btn-scan">📷 Scan</button>
  </section>

  <!-- 2. Medication Detail -->
  <section id="screen-detail" class="screen hidden">
    <h2 id="med-name">Antibiotic</h2>
    <img src="Amoxicillin.jpg" class="med-photo" alt="Medication">
    <img src="https://place-hold.it/96x96/007aff/fff?text=Dr" class="ai-avatar" alt="AI Doctor avatar">
    <button id="btn-play">▶ Play&nbsp;Video</button>
    <!-- video element hidden until play -->
    <video id="med-video" class="hidden" controls>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="tab-row" role="tablist">
      <button id="tab-dosage" class="active" role="tab" aria-selected="true">Dosage</button>
      <button id="tab-sidefx" role="tab" aria-selected="false">Side&nbsp;Effects</button>
    </div>
    <div id="detail-body">
      <p><strong>Take&nbsp;1 pill</strong> with food.</p>
    </div>

    <button id="btn-open-tracker" style="margin-top:1.25rem;">Done → Tracker</button>
  </section>

  <!-- 3. Tracker -->
  <section id="screen-tracker" class="screen hidden">
    <h2>Tracker</h2>
    <div id="ring" class="progress-ring" style="--pct:0">
      <span id="ring-text">0/3</span>
    </div>
    <form class="checklist">
      <label><input type="checkbox" data-dose="morning">☀️ Morning</label>
      <label><input type="checkbox" data-dose="midday">💊 Midday</label>
      <label><input type="checkbox" data-dose="evening">🌙 Evening</label>
    </form>
    <button id="btn-to-list">All&nbsp;Meds</button>
  </section>

  <!-- 4. Today’s Meds -->
  <section id="screen-list" class="screen hidden">
    <h2>Hello, Tony</h2>
    <h3 style="margin:.5rem 0 1rem">Today’s Meds</h3>
    <article class="med-card"><span>Antibiotic</span><span>1 pill</span></article>
    <article class="med-card"><span>Vitamin D</span><span>1 pill</span></article>
    <article class="med-card"><span>Lorazepam</span><span>0.5 mg</span></article>
    <button id="btn-rescan">Scan Label</button>
  </section>
</main>
<script>
/*––– simple SPA nav helper ––––––––––*/
const screens=["scan","detail","tracker","list"];
function show(id){screens.forEach(s=>document.getElementById(`screen-${s}`).classList.toggle("hidden",s!==id));}

/*––– Initialize camera –––––––––––––––*/
(async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    document.getElementById("camera-stream").srcObject=stream;
  }catch(err){
    console.warn("Camera access denied or unavailable",err);
    // fallback: show placeholder background
    document.getElementById("camera-stream").classList.add("hidden");
  }
})();

/*––– 1. FAKE scan (demo) –––––––––––––*/
document.getElementById("btn-scan").onclick=()=>{
  // TODO: integrate QR/RFID actual scan here
  show("detail");
};

/*––– 2. Play video in detail screen ––*/
const playBtn=document.getElementById("btn-play");
const videoEl=document.getElementById("med-video");
playBtn.onclick=()=>{
  playBtn.classList.add("hidden");
  videoEl.classList.remove("hidden");
  videoEl.play();
};

/*––– Tabs inside detail ––––––––––––––*/
const detailBody=document.getElementById("detail-body");
document.getElementById("tab-dosage").onclick=e=>{
  e.target.classList.add("active");document.getElementById("tab-sidefx").classList.remove("active");
  detailBody.innerHTML=`<p><strong>Take&nbsp;1 pill</strong> with food.</p>`;
};
document.getElementById("tab-sidefx").onclick=e=>{
  e.target.classList.add("active");document.getElementById("tab-dosage").classList.remove("active");
  detailBody.innerHTML=`<ul><li>Nausea</li><li>Headache</li></ul>`;
};

/*––– to tracker ––––––––––––––––––––––*/
document.getElementById("btn-open-tracker").onclick=()=>show("tracker");

/*––– tracker logic –––––––––––––––––––*/
const checkboxes=[...document.querySelectorAll('.checklist input')];
checkboxes.forEach(cb=>cb.addEventListener('change',updateRing));
function updateRing(){
  const done=checkboxes.filter(cb=>cb.checked).length;
  const pct=(done/3)*100;
  document.getElementById("ring").style.setProperty("--pct",pct);
  document.getElementById("ring-text").textContent=`${done}/3`;
}
updateRing();

/*––– nav buttons –––––––––––––––––––––*/
document.getElementById("btn-to-list").onclick=()=>show("list");
document.getElementById("btn-rescan").onclick=()=>show("scan");

/*––– launch –––––––––––––––––––––––––*/
show("scan");
</script>
</body>
</html>
